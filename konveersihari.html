<!DOCTYPE html>
<html>
<head>
    <title>Konversi hari</title>
</head>
<body>
    <h2>Konversi hari</h2>
    <label>masukkan total hari:</label>
    <input type="number" id="inputHari">
    <button onclick="hitungProyek()">konversi</button>

    <hr>
    <h3>hasil konversi:</h3>
    <p id="hasilTahun">Tahun: 0</p>
    <p id="hasilBulan">Bulan: 0</p>
    <p id="hasilSisaHari">Hari: 0</p>
    <script>
        function hitungProyek() {
            let x = parseInt(document.getElementById("inputHari").value);
            let thn = Math.floor(x / 365);
            let sisa = x % 365;
            let bln = Math.floor(sisa / 30);
            let hr = sisa % 30;
            document.getElementById("hasilTahun").innerHTML = "Tahun: " + thn;
            document.getElementById("hasilBulan").innerHTML = "Bulan: " + bln;
            document.getElementById("hasilSisaHari").innerHTML = "Hari: " + hr;
        }
    </script>
</body>
</html>
