<!DOCTYPE html>
<html>
<head><title>jumlah hari</title>
</head>
<body>
    <h2>hitung jumlah hari dalam bulan</h2>
    nomor bulan (1-12): <input type="number" id="blnInput"><br><br>
    tahun: <input type="number" id="thnInput"><br><br>
    <button onclick="hitungHari()">cek jumlah hari</button>
    <hr>
    <p id="outHariTotal"></p>
    <script>
        function hitungHari() {
            let bulan = parseInt(document.getElementById("blnInput").value);
            let tahun = parseInt(document.getElementById("thnInput").value);
            let hari = 0;
            if (bulan===1 || bulan===3 || bulan===5 || bulan===7 || bulan===8 || bulan===10 || bulan===12) {
                hari = 31;
            } else if (bulan===4 || bulan===6 || bulan===9 || bulan===11) {
                hari = 30;
            } else if (bulan === 2) {
                if ((tahun % 4 === 0 && tahun % 100 !== 0) || (tahun % 400 === 0)) {
                    hari = 29;
                } else {
                    hari = 28;
                }
            }
            document.getElementById("outHariTotal").innerHTML = "Jumlah hari: " + hari + " hari";
        }
    </script>
</body>
</html>
